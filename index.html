<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkathon Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Walkathon Registration Form</h1>
    <p class="subtitle">Help the Needy - Register Today</p>
<div class="event-details">
    <b>Date: 31st July</b><br>
    <b>Timing: 7:00 AM - 10:00 AM</b>
</div>

    <form id="registrationForm">

        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Enter your age" required>
        </div>

        <div class="input-group">
            <label>Gender</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
        </div>

        <div class="input-group">
            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" required>
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        
             <div class="input-group">
            <label for="emergency">Emergency Contact Number</label>
            <input type="tel" id="emergency" placeholder="Emergency contact number" required>
        </div>

        <div class="input-group">
            <label for="shirt">T-Shirt Size</label>
            <select id="shirt" required>
                <option value="">Select Size</option>
                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
                <option>XXL</option>
            </select>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="agree" required>
            <label for="agree">
                I agree to follow all the rules and participate at my own risk.
            </label>
        </div>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>

</div>

<script src="script.js"></script>

</body>
</html>
